book:
  title: "Datos, código y criterio"
  subtitle: "Un libro sobre análisis de datos con R y Python"
  author: "Rafael Mendoza"
  cover-image: imagenes/portada.png
  cover-image-alt: "Portada del libro. El título está escrito como un flujo de código, en letra grande: datos, con dos filas crudas de un CSV; código, con el flujo que las lee y las mismas filas ya ordenadas; y criterio, con un gráfico de violín de los tiempos de entrega por sucursal, donde un solo punto está marcado en negro con el comentario: 32,6 horas, ¿qué pasó en S03? Abajo, en una franja negra, el subtítulo y el autor."
  date: today
  language: es
  repo-url: https://github.com/romu545/codigo-datos-criterio
  repo-branch: main
  repo-actions: [issue, edit]
  code-links:
    - text: "Materiales del libro"
      href: "https://github.com/romu545/codigo-datos-criterio-material"
  chapters:
    - index.qmd
    - part: "Punto de partida"
      chapters:
        - 01-introduccion.qmd
        - 02-fundamentos-y-preparacion-del-entorno.qmd
    - part: "Obtener los datos"
      chapters:
        - 03-importacion-de-datos.qmd
        - 04-importacion-formatos-y-fuentes.qmd
        - 05-importacion-limpieza-temprana.qmd
    - part: "Preparar y guardar los datos"
      chapters:
        - 06-tipos-de-datos-y-calidad.qmd
        - 07-transformacion-y-ordenado.qmd
        - 08-limpieza-de-datos.qmd
        - 09-transformar-a-escala.qmd
        - 10-guardar-y-compartir-datos.qmd
    - part: "Analizar y programar"
      chapters:
        - 11-estadistica-descriptiva-exploracion-y-graficos.qmd
        - 12-funciones-personalizadas.qmd
        - 13-flujos-reproducibles-y-depuracion.qmd
    - part: "Comunicar y mantener"
      chapters:
        - 14-graficos-para-comunicar.qmd
        - 15-reportes-con-quarto.qmd
        - 16-excel-presentaciones-y-tableros.qmd
        - 17-probar-proteger-publicar-y-mantener.qmd
    - references.qmd

  page-footer:
    left: "© 2026 Rafael Mendoza. Texto bajo licencia [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/deed.es)."
    right:
      - icon: github
        href: https://github.com/romu545/codigo-datos-criterio
        aria-label: Repositorio del libro en GitHub


lang: es
bibliography: references.bib
license: "CC BY-NC-SA"

