<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="titulo desc">
<title id="titulo">La jerarquía de coerción</title>
<desc id="desc">Cuatro tipos de menor a mayor generalidad: lógico, entero, decimal y texto. Al mezclar tipos, R convierte todos los valores al más general. Ejemplos de mezclas y del comportamiento de cada herramienta. Con trazo discontinuo, la práctica que se debe evitar: dejar que la conversión implícita decida.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:13.5px}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="450" fill="#ffffff"/>

<!-- Escalera de tipos -->
<rect x="30" y="30" width="190" height="84" rx="10" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="125" y="62" class="h" text-anchor="middle">Lógico</text>
<text x="125" y="90" class="m" text-anchor="middle">TRUE</text>

<line x1="222" y1="72" x2="268" y2="72" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>

<rect x="272" y="30" width="190" height="84" rx="10" fill="#e6e6e6" stroke="#a8a8a8" stroke-width="1.5"/>
<text x="367" y="62" class="h" text-anchor="middle">Entero</text>
<text x="367" y="90" class="m" text-anchor="middle">2L</text>

<line x1="464" y1="72" x2="510" y2="72" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>

<rect x="514" y="30" width="190" height="84" rx="10" fill="#d6d6d6" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="609" y="62" class="h" text-anchor="middle">Decimal (doble)</text>
<text x="609" y="90" class="m" text-anchor="middle">3.5</text>

<line x1="706" y1="72" x2="752" y2="72" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>

<rect x="756" y="30" width="174" height="84" rx="10" fill="#1a1a1a"/>
<text x="843" y="62" class="h" text-anchor="middle" style="fill:#ffffff">Texto</text>
<text x="843" y="90" class="m" text-anchor="middle" style="fill:#ffffff">"a"</text>

<text x="30" y="146" class="s">menos general</text>
<text x="930" y="146" class="s" text-anchor="end">más general: cualquier valor cabe como texto</text>

<!-- Ejemplos en R -->
<rect x="30" y="166" width="470" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="48" y="192" class="s" style="font-weight:700">EN R SE ESCRIBE</text>
<text x="250" y="192" class="s" style="font-weight:700">Y QUEDA</text>
<text x="420" y="192" class="s" style="font-weight:700">TIPO</text>
<line x1="48" y1="202" x2="482" y2="202" stroke="#c4c4c4" stroke-width="1"/>
<text x="48" y="228" class="m">c(TRUE, 2L)</text>
<text x="250" y="228" class="m">1 2</text>
<text x="420" y="228" class="b">entero</text>
<text x="48" y="258" class="m">c(TRUE, 2L, 3.5)</text>
<text x="250" y="258" class="m">1.0 2.0 3.5</text>
<text x="420" y="258" class="b">doble</text>
<text x="48" y="288" class="m">c(1, "a", TRUE)</text>
<text x="250" y="288" class="m">"1" "a" "TRUE"</text>
<text x="420" y="288" class="b">texto</text>

<!-- Cada herramienta -->
<rect x="520" y="166" width="410" height="150" rx="10" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="538" y="192" class="s" style="font-weight:700">ANTE UNA MEZCLA</text>
<line x1="538" y1="202" x2="912" y2="202" stroke="#c4c4c4" stroke-width="1"/>
<text x="538" y="228" class="b"><tspan style="font-weight:700">R y NumPy:</tspan> convierten en silencio.</text>
<text x="538" y="258" class="b"><tspan style="font-weight:700">pandas:</tspan> guarda la mezcla como object.</text>
<text x="538" y="288" class="b"><tspan style="font-weight:700">DuckDB:</tspan> busca un tipo común o da error.</text>

<!-- Evitar -->
<rect x="30" y="336" width="900" height="44" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="48" y="364" class="b" style="font-weight:700;fill:#555555">Evitar</text>
<text x="110" y="364" class="b" style="fill:#555555">dejar que la conversión implícita decida:</text>
<text x="400" y="364" class="m" style="fill:#555555">as.numeric("1.200")</text>
<text x="565" y="364" class="b" style="fill:#555555">da 1,2 y no mil doscientos.</text>

<rect x="30" y="394" width="900" height="44" rx="8" fill="#1a1a1a"/>
<text x="480" y="421" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Convierte de forma explícita y cuenta los faltantes que aparecen al convertir.</text>
</svg>
