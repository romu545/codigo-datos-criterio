<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" role="img" aria-labelledby="titulo desc">
<title id="titulo">Dimensiones de la calidad de los datos</title>
<desc id="desc">Seis tarjetas, cada una con su pregunta y una regla de la cartera. Completitud: ¿está el dato?, el nit no es faltante. Unicidad: ¿aparece una sola vez?, cada factura en una sola fila. Validez: ¿cumple dominio, rango y formato?, calificación de 1 a 5 y NIT de 10 dígitos. Consistencia: ¿concuerdan las columnas?, la fecha de pago no es anterior a la emisión. Integridad referencial: ¿existe en la tabla de referencia?, el nit está en clientes. Plausibilidad: ¿es razonable?, valor hasta 50 millones o se revisa. Abajo, la exactitud: ninguna regla interna garantiza que el dato sea verdad; se comprueba contra una fuente externa.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:13px}
</style>

<rect x="0" y="0" width="960" height="450" fill="#ffffff"/>

<!-- Fila superior: una columna -->
<text x="30" y="22" class="s" style="font-weight:700">MIRAN UNA COLUMNA</text>

<rect x="30" y="32" width="286" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="48" y="62" class="h">Completitud</text>
<text x="48" y="86" class="b">¿Está el dato?</text>
<line x1="48" y1="100" x2="298" y2="100" stroke="#c4c4c4" stroke-width="1"/>
<text x="48" y="124" class="s">En la cartera:</text>
<text x="48" y="148" class="m">nit no es faltante</text>

<rect x="337" y="32" width="286" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="355" y="62" class="h">Unicidad</text>
<text x="355" y="86" class="b">¿Aparece una sola vez?</text>
<line x1="355" y1="100" x2="605" y2="100" stroke="#c4c4c4" stroke-width="1"/>
<text x="355" y="124" class="s">En la cartera:</text>
<text x="355" y="148" class="m">cada factura, una fila</text>

<rect x="644" y="32" width="286" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="662" y="62" class="h">Validez</text>
<text x="662" y="86" class="b">¿Cumple dominio, rango y formato?</text>
<line x1="662" y1="100" x2="912" y2="100" stroke="#c4c4c4" stroke-width="1"/>
<text x="662" y="124" class="s">En la cartera:</text>
<text x="662" y="148" class="m">calificacion de 1 a 5</text>
<text x="662" y="168" class="m">nit de 10 dígitos</text>

<!-- Fila inferior: relaciones -->
<text x="30" y="212" class="s" style="font-weight:700">MIRAN RELACIONES Y CONTEXTO</text>

<rect x="30" y="222" width="286" height="150" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="48" y="252" class="h">Consistencia</text>
<text x="48" y="276" class="b">¿Concuerdan las columnas?</text>
<line x1="48" y1="290" x2="298" y2="290" stroke="#c4c4c4" stroke-width="1"/>
<text x="48" y="314" class="s">En la cartera:</text>
<text x="48" y="338" class="m">fecha_pago &gt;= fecha_emision</text>
<text x="48" y="358" class="m">pagada sin saldo</text>

<rect x="337" y="222" width="286" height="150" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="355" y="252" class="h">Integridad referencial</text>
<text x="355" y="276" class="b">¿Existe donde debe existir?</text>
<line x1="355" y1="290" x2="605" y2="290" stroke="#c4c4c4" stroke-width="1"/>
<text x="355" y="314" class="s">En la cartera:</text>
<text x="355" y="338" class="m">nit está en clientes</text>

<rect x="644" y="222" width="286" height="150" rx="10" fill="#f2f2f2" stroke="#8a8a8a" stroke-width="1.5"/>
<text x="662" y="252" class="h">Plausibilidad</text>
<text x="662" y="276" class="b">¿Es razonable?</text>
<line x1="662" y1="290" x2="912" y2="290" stroke="#c4c4c4" stroke-width="1"/>
<text x="662" y="314" class="s">En la cartera:</text>
<text x="662" y="338" class="m">valor hasta 50 millones;</text>
<text x="662" y="358" class="s">si lo supera, se revisa</text>

<!-- Exactitud -->
<rect x="30" y="392" width="900" height="48" rx="8" fill="#1a1a1a"/>
<text x="48" y="421" class="b" style="fill:#ffffff"><tspan style="font-weight:700">Exactitud: ¿es verdad?</tspan> Ninguna regla interna lo garantiza; se comprueba contra una fuente externa.</text>
</svg>
