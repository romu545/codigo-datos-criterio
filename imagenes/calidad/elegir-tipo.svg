<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" width="960" height="590" role="img" aria-labelledby="titulo desc">
<title id="titulo">Cómo elegir el tipo de una columna</title>
<desc id="desc">Seis preguntas en orden. Si la columna identifica algo, es texto. Si solo toma dos valores, es lógica. Si es un momento en el tiempo, es fecha o fecha y hora con zona. Si tiene un conjunto cerrado de valores, es categoría. Si es un conteo, es entero. Si es una medida o dinero, es decimal. Si no, texto libre. Prueba rápida: si no tiene sentido sumarlo ni promediarlo, no es un número.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:13px}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="590" fill="#ffffff"/>

<!-- Fila 1 -->
<rect x="30" y="30" width="420" height="58" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="55" class="b" style="font-weight:700">1. ¿Identifica algo?</text>
<text x="46" y="76" class="s">NIT, número de factura, código DANE, teléfono</text>
<line x1="452" y1="59" x2="520" y2="59" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="486" y="51" class="s" text-anchor="middle">sí</text>
<rect x="526" y="30" width="404" height="58" rx="8" fill="#1a1a1a"/>
<text x="542" y="55" class="h" style="fill:#ffffff">Texto, aunque solo tenga dígitos</text>
<text x="542" y="76" class="m" style="fill:#ffffff">nit, factura, codigo_dane</text>
<line x1="240" y1="88" x2="240" y2="106" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="250" y="102" class="s">no</text>

<!-- Fila 2 -->
<rect x="30" y="108" width="420" height="58" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="133" class="b" style="font-weight:700">2. ¿Solo puede tomar dos valores?</text>
<text x="46" y="154" class="s">sí o no, activo o inactivo</text>
<line x1="452" y1="137" x2="520" y2="137" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="486" y="129" class="s" text-anchor="middle">sí</text>
<rect x="526" y="108" width="404" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="542" y="133" class="h">Lógico</text>
<text x="542" y="154" class="m">pagada, cliente_activo</text>
<line x1="240" y1="166" x2="240" y2="184" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="250" y="180" class="s">no</text>

<!-- Fila 3 -->
<rect x="30" y="186" width="420" height="58" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="211" class="b" style="font-weight:700">3. ¿Es un momento en el tiempo?</text>
<text x="46" y="232" class="s">un día, o un instante con hora</text>
<line x1="452" y1="215" x2="520" y2="215" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="486" y="207" class="s" text-anchor="middle">sí</text>
<rect x="526" y="186" width="404" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="542" y="211" class="h">Fecha, o fecha y hora con zona</text>
<text x="542" y="232" class="m">fecha_emision, registrado_en</text>
<line x1="240" y1="244" x2="240" y2="262" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="250" y="258" class="s">no</text>

<!-- Fila 4 -->
<rect x="30" y="264" width="420" height="58" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="289" class="b" style="font-weight:700">4. ¿Tiene un conjunto cerrado de valores?</text>
<text x="46" y="310" class="s">una lista conocida que casi no cambia</text>
<line x1="452" y1="293" x2="520" y2="293" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="486" y="285" class="s" text-anchor="middle">sí</text>
<rect x="526" y="264" width="404" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="542" y="289" class="h">Categoría</text>
<text x="542" y="310" class="m">ciudad, medio_pago</text>
<text x="914" y="310" class="s" text-anchor="end">factor, category, ENUM</text>
<line x1="240" y1="322" x2="240" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="250" y="336" class="s">no</text>

<!-- Fila 5 -->
<rect x="30" y="342" width="420" height="58" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="367" class="b" style="font-weight:700">5. ¿Es un conteo?</text>
<text x="46" y="388" class="s">cantidades que no admiten fracciones</text>
<line x1="452" y1="371" x2="520" y2="371" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="486" y="363" class="s" text-anchor="middle">sí</text>
<rect x="526" y="342" width="404" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="542" y="367" class="h">Entero</text>
<text x="542" y="388" class="m">calificacion, unidades</text>
<line x1="240" y1="400" x2="240" y2="418" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="250" y="414" class="s">no</text>

<!-- Fila 6 -->
<rect x="30" y="420" width="420" height="58" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="445" class="b" style="font-weight:700">6. ¿Es una medida o dinero?</text>
<text x="46" y="466" class="s">valores que se suman o promedian</text>
<line x1="452" y1="449" x2="520" y2="449" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="486" y="441" class="s" text-anchor="middle">sí</text>
<rect x="526" y="420" width="404" height="58" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="542" y="445" class="h">Decimal</text>
<text x="542" y="466" class="m">valor_factura, saldo</text>
<text x="914" y="466" class="s" text-anchor="end">DECIMAL si debe cuadrar</text>
<line x1="240" y1="478" x2="240" y2="496" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#fl)"/>
<text x="250" y="492" class="s">no</text>
<text x="30" y="520" class="b">Texto libre, como unas observaciones.</text>

<rect x="30" y="536" width="900" height="44" rx="8" fill="#1a1a1a"/>
<text x="480" y="563" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Prueba rápida: si no tiene sentido sumarlo ni promediarlo, no es un número.</text>
</svg>
