<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" role="img" aria-labelledby="titulo desc">
<title id="titulo">El flujo de una auditoría de calidad</title>
<desc id="desc">Cuatro pasos en fila: la tabla bien leída del capítulo 5, el perfil de cada columna, las reglas que cada fila debe cumplir y el reporte con las fallas por regla y las filas marcadas. Del reporte salen tres decisiones: corregir con reglas explícitas en el capítulo 8, devolver a la fuente o aceptar y documentar. Con trazo discontinuo, la práctica que se debe evitar: corregir sobre la marcha, sin medir ni dejar registro.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:13px}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="490" fill="#ffffff"/>

<!-- Pasos -->
<rect x="30" y="30" width="195" height="150" rx="10" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="58" class="h">Tabla bien leída</text>
<text x="46" y="84" class="s">el contrato del</text>
<text x="46" y="104" class="s">Capítulo 5: nombres,</text>
<text x="46" y="124" class="s">tipos y faltantes</text>
<text x="46" y="144" class="s">ya resueltos</text>

<line x1="227" y1="105" x2="261" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>

<rect x="265" y="30" width="195" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="281" y="58" class="h">1. Perfil</text>
<text x="281" y="84" class="s">un resumen por</text>
<text x="281" y="104" class="s">columna: mínimos,</text>
<text x="281" y="124" class="s">máximos, faltantes y</text>
<text x="281" y="144" class="s">valores distintos</text>

<line x1="462" y1="105" x2="496" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>

<rect x="500" y="30" width="195" height="150" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="516" y="58" class="h">2. Reglas</text>
<text x="516" y="84" class="s">lo que cada fila debe</text>
<text x="516" y="104" class="s">cumplir, con su</text>
<text x="516" y="124" class="s">dimensión y su</text>
<text x="516" y="144" class="s">severidad</text>

<line x1="697" y1="105" x2="731" y2="105" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>

<rect x="735" y="30" width="195" height="150" rx="10" fill="#1a1a1a"/>
<text x="751" y="58" class="h" style="fill:#ffffff">3. Reporte</text>
<text x="751" y="84" class="s" style="fill:#ffffff">filas que fallan en</text>
<text x="751" y="104" class="s" style="fill:#ffffff">cada regla y cada</text>
<text x="751" y="124" class="s" style="fill:#ffffff">fila marcada con</text>
<text x="751" y="144" class="s" style="fill:#ffffff">sus problemas</text>

<!-- Decisiones -->
<line x1="832" y1="180" x2="832" y2="214" stroke="#1a1a1a" stroke-width="2"/>
<line x1="170" y1="214" x2="832" y2="214" stroke="#1a1a1a" stroke-width="2"/>
<line x1="170" y1="214" x2="170" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<line x1="480" y1="214" x2="480" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<line x1="790" y1="214" x2="790" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="530" y="200" width="110" height="26" fill="#ffffff"/>
<text x="585" y="219" class="s" text-anchor="middle" style="font-weight:700">4. DECIDIR</text>

<rect x="30" y="246" width="280" height="86" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="48" y="274" class="h">Corregir</text>
<text x="48" y="298" class="s">con reglas explícitas y</text>
<text x="48" y="318" class="s">repetibles (Capítulo 8)</text>

<rect x="340" y="246" width="280" height="86" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="358" y="274" class="h">Devolver a la fuente</text>
<text x="358" y="298" class="s">cuando solo quien generó el</text>
<text x="358" y="318" class="s">dato conoce el valor correcto</text>

<rect x="650" y="246" width="280" height="86" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="668" y="274" class="h">Aceptar y documentar</text>
<text x="668" y="298" class="s">cuando el valor es raro,</text>
<text x="668" y="318" class="s">pero cierto</text>

<!-- Evitar -->
<rect x="30" y="354" width="900" height="56" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="48" y="388" class="b" style="font-weight:700;fill:#555555">Evitar</text>
<text x="110" y="388" class="b" style="fill:#555555">corregir sobre la marcha, sin medir cuántas filas cambian ni dejar registro de por qué.</text>

<rect x="30" y="430" width="900" height="44" rx="8" fill="#1a1a1a"/>
<text x="480" y="457" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Este capítulo mide y marca; el Capítulo 8 corrige.</text>
</svg>
