<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="titulo desc">
<title id="titulo">Del gráfico de trabajo al gráfico que explica</title>
<desc id="desc">A la izquierda, un gráfico de trabajo: ocho líneas de colores, una leyenda con ocho entradas, un título que describe los ejes y un pico llamativo de S07. A la derecha, el mismo dato convertido en un gráfico que explica, con seis marcas numeradas: un título que dice la conclusión, las líneas de contexto en gris y la de Cali en negro, una etiqueta directa en lugar de la leyenda, una anotación con lo que el lector no sabe, el pico de S07 marcado como pocos datos, y la fuente con el número de pedidos al pie. Al pie: el gráfico de trabajo responde una pregunta tuya; el que explica responde la pregunta de otro.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:16px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:13px;fill:#3d3d3d}
  .t{font-size:11px;fill:#3d3d3d}
  .n{font-size:12px;font-weight:700;fill:#ffffff}
</style>
<rect x="0" y="0" width="960" height="600" fill="#ffffff"/>

<!-- Panel izquierdo: trabajo -->
<text x="30" y="30" class="h">Gráfico de trabajo</text>
<text x="30" y="48" class="s">para entender: rápido, completo, sin pulir</text>
<rect x="30" y="60" width="420" height="320" rx="8" fill="#ffffff" stroke="#8a8a8a"/>
<text x="46" y="86" class="t" style="font-size:12.5px">pct_tardias por mes y sucursal</text>
<!-- ejes -->
<line x1="70" y1="330" x2="330" y2="330" stroke="#8a8a8a"/>
<line x1="70" y1="110" x2="70" y2="330" stroke="#8a8a8a"/>
<!-- líneas grises de distinto tono simulando colores -->
<polyline points="80,300 160,290 240,302 320,306" fill="none" stroke="#6e6e6e" stroke-width="1.6"/>
<polyline points="80,316 160,310 240,312 320,318" fill="none" stroke="#9a9a9a" stroke-width="1.6"/>
<polyline points="80,160 160,130 240,190 320,194" fill="none" stroke="#4a4a4a" stroke-width="1.6"/>
<polyline points="80,312 160,316 240,314 320,310" fill="none" stroke="#b5b5b5" stroke-width="1.6"/>
<polyline points="80,308 160,300 240,300 320,308" fill="none" stroke="#7d7d7d" stroke-width="1.6"/>
<polyline points="80,304 160,292 240,306 320,310" fill="none" stroke="#a8a8a8" stroke-width="1.6"/>
<polyline points="80,320 160,230 240,320 320,320" fill="none" stroke="#2e2e2e" stroke-width="1.6" stroke-dasharray="4 2"/>
<polyline points="80,306 160,320 240,306 320,308" fill="none" stroke="#c4c4c4" stroke-width="1.6"/>
<!-- leyenda -->
<rect x="346" y="110" width="94" height="150" fill="#f6f6f6" stroke="#cfcfcf"/>
<text x="356" y="128" class="t">sucursal</text>
<text x="356" y="146" class="t">S01  S02  S03</text>
<text x="356" y="164" class="t">S04  S05  S06</text>
<text x="356" y="182" class="t">S07  S08</text>
<text x="356" y="210" class="t">ocho colores</text>
<text x="356" y="226" class="t">que hay que</text>
<text x="356" y="242" class="t">emparejar</text>
<text x="46" y="364" class="s">El ojo va al pico de S07 (4 pedidos), no a Cali.</text>

<!-- Flecha central -->
<line x1="462" y1="220" x2="500" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
<path d="M 500 212 L 512 220 L 500 228 z" fill="#1a1a1a"/>

<!-- Panel derecho: explicativo -->
<text x="520" y="30" class="h">Gráfico que explica</text>
<text x="520" y="48" class="s">para otros: una pregunta, un mensaje</text>
<rect x="520" y="60" width="410" height="320" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="544" y="88" style="font-size:14.5px;font-weight:700">Cali concentra las entregas tardías</text>
<text x="544" y="106" class="t" style="font-size:12px">% de entregas a domicilio con más de 20 horas</text>
<line x1="560" y1="330" x2="810" y2="330" stroke="#cfcfcf"/>
<!-- contexto gris -->
<polyline points="570,300 650,290 730,302 800,306" fill="none" stroke="#cfcfcf" stroke-width="1.6"/>
<polyline points="570,316 650,310 730,312 800,318" fill="none" stroke="#cfcfcf" stroke-width="1.6"/>
<polyline points="570,312 650,316 730,314 800,310" fill="none" stroke="#cfcfcf" stroke-width="1.6"/>
<polyline points="570,308 650,300 730,300 800,308" fill="none" stroke="#cfcfcf" stroke-width="1.6"/>
<polyline points="570,304 650,292 730,306 800,310" fill="none" stroke="#cfcfcf" stroke-width="1.6"/>
<polyline points="570,306 650,320 730,306 800,308" fill="none" stroke="#cfcfcf" stroke-width="1.6"/>
<polyline points="570,320 650,230 730,320 800,320" fill="none" stroke="#cfcfcf" stroke-width="1.2" stroke-dasharray="2 3"/>
<!-- S03 -->
<polyline points="570,160 650,130 730,190 800,194" fill="none" stroke="#1a1a1a" stroke-width="3"/>
<text x="808" y="198" style="font-size:13px;font-weight:700">Cali</text>
<text x="808" y="318" class="t">resto</text>
<!-- anotación -->
<text x="706" y="126" class="t">dos clases de entrega:</text>
<text x="706" y="140" class="t">moto y transportadora</text>
<text x="664" y="244" class="t">S07: 4 pedidos</text>
<text x="544" y="364" class="t">Fuente: flujo de entregas, enero a abril de 2026; 2.536 pedidos a domicilio.</text>

<!-- marcas numeradas -->
<circle cx="526" cy="83" r="9" fill="#1a1a1a"/><text x="526" y="87" class="n" text-anchor="middle">1</text>
<circle cx="560" cy="296" r="9" fill="#1a1a1a"/><text x="560" y="300" class="n" text-anchor="middle">2</text>
<circle cx="846" cy="194" r="9" fill="#1a1a1a"/><text x="846" y="198" class="n" text-anchor="middle">3</text>
<circle cx="694" cy="122" r="9" fill="#1a1a1a"/><text x="694" y="126" class="n" text-anchor="middle">4</text>
<circle cx="654" cy="240" r="9" fill="#1a1a1a"/><text x="654" y="244" class="n" text-anchor="middle">5</text>
<circle cx="526" cy="360" r="9" fill="#1a1a1a"/><text x="526" y="364" class="n" text-anchor="middle">6</text>

<!-- Lista -->
<rect x="30" y="400" width="900" height="146" rx="8" fill="#f2f2f2"/>
<text x="46" y="424" class="s"><tspan font-weight="700">1</tspan>  El título dice la conclusión, no los ejes. El subtítulo dice qué se mide.</text>
<text x="46" y="446" class="s"><tspan font-weight="700">2</tspan>  Gris para el contexto, negro (o un color) solo para el mensaje.</text>
<text x="46" y="468" class="s"><tspan font-weight="700">3</tspan>  Etiquetas junto a los datos en lugar de una leyenda que obliga a ir y volver.</text>
<text x="46" y="490" class="s"><tspan font-weight="700">4</tspan>  Una anotación con lo que el lector no sabe y el análisis sí.</text>
<text x="46" y="512" class="s"><tspan font-weight="700">5</tspan>  Lo que tiene pocos datos se marca o se aparta: no puede ser lo más llamativo.</text>
<text x="46" y="534" class="s"><tspan font-weight="700">6</tspan>  La fuente, el periodo y cuántos datos hay, al pie.</text>

<rect x="30" y="556" width="900" height="36" rx="8" fill="#1a1a1a"/>
<text x="480" y="579" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">El gráfico de trabajo responde una pregunta tuya; el que explica responde la pregunta de otro.</text>
</svg>
