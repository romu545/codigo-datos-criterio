<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="titulo desc">
<title id="titulo">Anidar, calcular y desanidar</title>
<desc id="desc">A la izquierda, una tabla larga con las ventas diarias de varias sucursales. nest la convierte en una tabla con una fila por sucursal y una columna data en la que cada celda guarda la tabla de esa sucursal. Con mutate y map se agrega una columna modelo, con un modelo por sucursal, y con map_dbl una columna pendiente, con un número por sucursal. unnest hace el camino inverso y devuelve las filas originales. Al pie: cuando el cálculo necesita el grupo completo y no cabe en un resumen, se anida, se calcula con map y, si hace falta, se desanida.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px}
  .c{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="380" fill="#ffffff"/>

