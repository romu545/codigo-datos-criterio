<rect x="300" y="56" width="60" height="24" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1"/>
<text x="330" y="73" class="c" text-anchor="middle" style="fill:#ffffff">suc.</text>
<rect x="360" y="56" width="130" height="24" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1"/>
<text x="425" y="73" class="c" text-anchor="middle" style="fill:#ffffff">data</text>
<rect x="300" y="80" width="60" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="330" y="97" class="c" text-anchor="middle">S01</text>
<rect x="360" y="80" width="130" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="425" y="97" class="c" text-anchor="middle">tabla 89 × 2</text>
<rect x="300" y="104" width="60" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="330" y="121" class="c" text-anchor="middle">S02</text>
<rect x="360" y="104" width="130" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="425" y="121" class="c" text-anchor="middle">tabla 89 × 2</text>
<rect x="300" y="128" width="60" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="330" y="145" class="c" text-anchor="middle">...</text>
<rect x="360" y="128" width="130" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="425" y="145" class="c" text-anchor="middle">...</text>
<text x="300" y="178" class="s">cada celda de data guarda</text>
<text x="300" y="196" class="s">la tabla de su sucursal</text>

<line x1="498" y1="104" x2="572" y2="104" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="535" y="94" class="c" text-anchor="middle">map()</text>

<text x="580" y="40" class="h">Un cálculo por grupo</text>
<rect x="580" y="56" width="60" height="24" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1"/>
<text x="610" y="73" class="c" text-anchor="middle" style="fill:#ffffff">suc.</text>
