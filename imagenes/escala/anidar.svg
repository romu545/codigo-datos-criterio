<text x="675" y="73" class="c" text-anchor="middle" style="fill:#ffffff">data</text>
<rect x="710" y="56" width="90" height="24" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1"/>
<text x="755" y="73" class="c" text-anchor="middle" style="fill:#ffffff">modelo</text>
<rect x="800" y="56" width="110" height="24" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1"/>
<text x="855" y="73" class="c" text-anchor="middle" style="fill:#ffffff">pendiente</text>
<rect x="580" y="80" width="60" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="610" y="97" class="c" text-anchor="middle">S01</text>
<rect x="640" y="80" width="70" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="675" y="97" class="c" text-anchor="middle">tabla</text>
<rect x="710" y="80" width="90" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="755" y="97" class="c" text-anchor="middle">lm</text>
<rect x="800" y="80" width="110" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="855" y="97" class="c" text-anchor="middle">-0,003</text>
<rect x="580" y="104" width="60" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="610" y="121" class="c" text-anchor="middle">S02</text>
<rect x="640" y="104" width="70" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="675" y="121" class="c" text-anchor="middle">tabla</text>
<rect x="710" y="104" width="90" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="755" y="121" class="c" text-anchor="middle">lm</text>
<rect x="800" y="104" width="110" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="855" y="121" class="c" text-anchor="middle">-0,002</text>
<text x="580" y="160" class="m" style="fill:#3d3d3d">modelo = map(data, ajustar)</text>
<text x="580" y="180" class="m" style="fill:#3d3d3d">pendiente = map_dbl(modelo, extraer)</text>
<text x="580" y="204" class="s">map() guarda objetos; map_dbl() guarda</text>
<text x="580" y="222" class="s">un número por grupo</text>

<path d="M 395 206 L 395 262 L 120 262 L 120 238" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="258" y="282" class="c" text-anchor="middle">unnest(): de vuelta a la tabla larga</text>

<rect x="30" y="314" width="900" height="44" rx="8" fill="#1a1a1a"/>
<text x="480" y="341" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Si el cálculo necesita el grupo completo y no cabe en un resumen: anidar, calcular con map y desanidar.</text>
</svg>
