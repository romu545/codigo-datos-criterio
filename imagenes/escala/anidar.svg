<rect x="160" y="104" width="50" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="185" y="121" class="c" text-anchor="middle">2,6</text>
<rect x="30" y="128" width="60" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="60" y="145" class="c" text-anchor="middle">...</text>
<rect x="90" y="128" width="70" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="125" y="145" class="c" text-anchor="middle">...</text>
<rect x="160" y="128" width="50" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="185" y="145" class="c" text-anchor="middle">...</text>
<rect x="30" y="152" width="60" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="60" y="169" class="c" text-anchor="middle">S02</text>
<rect x="90" y="152" width="70" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="125" y="169" class="c" text-anchor="middle">01-02</text>
<rect x="160" y="152" width="50" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="185" y="169" class="c" text-anchor="middle">1,9</text>
<rect x="30" y="176" width="60" height="24" fill="#d9d9d9" stroke="#8a8a8a"/><text x="60" y="193" class="c" text-anchor="middle">S02</text>
