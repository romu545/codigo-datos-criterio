</g>
<text x="30" y="226" class="s">una fila por sucursal y día</text>

<line x1="218" y1="128" x2="292" y2="128" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="255" y="118" class="c" text-anchor="middle">nest()</text>

