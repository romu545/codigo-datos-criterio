<text x="125" y="73" class="c" text-anchor="middle" style="fill:#ffffff">fecha</text>
<rect x="160" y="56" width="50" height="24" fill="#1a1a1a" stroke="#8a8a8a" stroke-width="1"/>
<text x="185" y="73" class="c" text-anchor="middle" style="fill:#ffffff">valor</text>
<g class="c">
<rect x="30" y="80" width="60" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="60" y="97" class="c" text-anchor="middle">S01</text>
<rect x="90" y="80" width="70" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="125" y="97" class="c" text-anchor="middle">01-02</text>
<rect x="160" y="80" width="50" height="24" fill="#ffffff" stroke="#8a8a8a"/><text x="185" y="97" class="c" text-anchor="middle">2,1</text>
