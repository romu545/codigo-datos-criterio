<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="titulo desc">
<title id="titulo">Cómo elegir la forma de iterar</title>
<desc id="desc">Un árbol de decisión. Primera pregunta: ¿existe una operación vectorizada o de tabla que lo haga? Si la respuesta es sí, úsala: aritmética sobre columnas, case_when, across, resúmenes por grupo o SQL. Si es no, segunda pregunta: ¿cada paso depende del resultado del paso anterior, o hay que detenerse a mitad de camino? Si es no, map o apply. Si es sí, un bucle for o while con el resultado reservado desde el principio. Con trazo discontinuo, Evitar: hacer crecer un vector o una tabla dentro del bucle, modificar una tabla celda por celda y usar sapply cuando importa el tipo del resultado.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px}
  .c{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

<rect x="330" y="20" width="300" height="64" rx="10" fill="#1a1a1a"/>
<text x="480" y="47" class="b" text-anchor="middle" style="fill:#ffffff">¿Existe una operación vectorizada</text>
<text x="480" y="68" class="b" text-anchor="middle" style="fill:#ffffff">o de tabla que lo haga?</text>

<path d="M 330 52 L 160 52 L 160 124" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="245" y="44" class="b" text-anchor="middle" style="font-weight:700">sí</text>
<line x1="480" y1="86" x2="480" y2="124" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="492" y="110" class="b" style="font-weight:700">no</text>

<rect x="30" y="130" width="260" height="124" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="46" y="156" class="h">Úsala</text>
<text x="46" y="180" class="s">aritmética sobre columnas,</text>
<text x="46" y="198" class="m">case_when(), across(),</text>
<text x="46" y="216" class="s">resúmenes por grupo, SQL.</text>
<text x="46" y="240" class="s">Es la más rápida y la más corta.</text>

<rect x="330" y="130" width="300" height="64" rx="10" fill="#1a1a1a"/>
<text x="480" y="157" class="b" text-anchor="middle" style="fill:#ffffff">¿Cada paso depende del anterior,</text>
<text x="480" y="178" class="b" text-anchor="middle" style="fill:#ffffff">o hay que detenerse a mitad?</text>

<line x1="632" y1="162" x2="664" y2="162" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="648" y="152" class="b" text-anchor="middle" style="font-weight:700">sí</text>
<line x1="480" y1="196" x2="480" y2="244" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="492" y="226" class="b" style="font-weight:700">no</text>

<rect x="670" y="130" width="260" height="124" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="686" y="156" class="h">Bucle for o while</text>
<text x="686" y="180" class="s">el estado pasa de un paso al</text>
<text x="686" y="198" class="s">siguiente; resultado reservado</text>
<text x="686" y="216" class="s">desde el principio, sobre vectores.</text>
<text x="686" y="240" class="s">Ejemplo: el inventario diario.</text>

<rect x="330" y="250" width="300" height="124" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="346" y="276" class="h">map o apply</text>
<text x="346" y="298" class="m">map_dbl(), vapply(),</text>
<text x="346" y="318" class="s">comprensión de listas.</text>
<text x="346" y="342" class="s">Cada elemento se procesa por separado;</text>
<text x="346" y="360" class="s">el tipo del resultado queda declarado.</text>

<rect x="670" y="270" width="260" height="104" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="686" y="294" class="h" style="fill:#555555">Evitar</text>
<text x="686" y="316" class="s">hacer crecer un vector o una tabla</text>
<text x="686" y="334" class="s">en cada vuelta; modificar una tabla</text>
<text x="686" y="352" class="s">celda por celda; </text><text x="790" y="352" class="m" style="fill:#3d3d3d">sapply()</text>
<text x="686" y="368" class="s">cuando importa el tipo.</text>

<rect x="30" y="398" width="900" height="44" rx="8" fill="#1a1a1a"/>
<text x="480" y="425" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Vectorizar cuando se pueda; map cuando cada elemento es independiente; bucle cuando un paso depende del anterior.</text>
</svg>
