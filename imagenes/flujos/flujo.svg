<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="titulo desc">
<title id="titulo">Un flujo de datos con pasos, bitácora y punto de control</title>
<desc id="desc">Cinco estaciones unidas por flechas: leer, armonizar, validar, resumir y guardar, con lo que entra y lo que sale de cada una en el trimestre. Validar es un punto de control: si una regla falla, el flujo se detiene ahí con un mensaje que nombra el archivo y la regla. Debajo, la bitácora con una línea por paso. Con trazo discontinuo, Evitar: un script largo sin pasos con nombre. Al pie: cada paso es una función; el flujo es la lista de funciones y el orden en que se aplican.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:16px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:13px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px}
  .n{font-size:13px;font-weight:700;fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>
<rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

<!-- Entrada -->
<rect x="20" y="40" width="96" height="92" rx="6" fill="#f2f2f2" stroke="#8a8a8a"/>
<text x="68" y="62" class="h" text-anchor="middle" style="font-size:13px">entrada</text>
<text x="68" y="84" class="m" text-anchor="middle">enero.csv</text>
<text x="68" y="102" class="m" text-anchor="middle">febrero.csv</text>
<text x="68" y="120" class="m" text-anchor="middle">marzo.csv</text>

<!-- Estaciones -->
<g>
<line x1="118" y1="86" x2="134" y2="86" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="138" y="40" width="140" height="92" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="156" cy="58" r="10" fill="#1a1a1a"/><text x="156" y="62" class="n" text-anchor="middle">1</text>
<text x="172" y="63" class="h">leer</text>
<text x="150" y="88" class="m">leer_crudo()</text>
<text x="150" y="110" class="s">todo como texto,</text>
<text x="150" y="126" class="s">sin adivinar tipos</text>

<line x1="280" y1="86" x2="296" y2="86" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="300" y="40" width="140" height="92" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="318" cy="58" r="10" fill="#1a1a1a"/><text x="318" y="62" class="n" text-anchor="middle">2</text>
<text x="334" y="63" class="h">armonizar</text>
<text x="312" y="88" class="m">armonizar()</text>
<text x="312" y="110" class="s">mismo esquema,</text>
<text x="312" y="126" class="s">tipos, una tabla</text>

<line x1="442" y1="86" x2="458" y2="86" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="462" y="40" width="140" height="92" rx="8" fill="#1a1a1a"/>
<circle cx="480" cy="58" r="10" fill="#ffffff"/><text x="480" y="62" class="n" text-anchor="middle" style="fill:#1a1a1a">3</text>
<text x="496" y="63" class="h" style="fill:#ffffff">validar</text>
<text x="474" y="88" class="m" style="fill:#ffffff">validar()</text>
<text x="474" y="110" class="s" style="fill:#ffffff">punto de control:</text>
<text x="474" y="126" class="s" style="fill:#ffffff">pasa o se detiene</text>

<line x1="604" y1="86" x2="620" y2="86" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="624" y="40" width="140" height="92" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="642" cy="58" r="10" fill="#1a1a1a"/><text x="642" y="62" class="n" text-anchor="middle">4</text>
<text x="658" y="63" class="h">resumir</text>
<text x="636" y="88" class="m">resumir()</text>
<text x="636" y="110" class="s">indicadores por</text>
<text x="636" y="126" class="s">sucursal y mes</text>

<line x1="766" y1="86" x2="782" y2="86" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="786" y="40" width="154" height="92" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="804" cy="58" r="10" fill="#1a1a1a"/><text x="804" y="62" class="n" text-anchor="middle">5</text>
<text x="820" y="63" class="h">guardar</text>
<text x="798" y="88" class="m">guardar()</text>
<text x="798" y="110" class="s">indicadores.csv</text>
</g>

<!-- Lo que viaja entre pasos -->
<text x="20" y="166" class="h" style="font-size:14px">Lo que pasa de un paso al siguiente (el contrato)</text>
<text x="160" y="190" class="s">lista de 3 tablas</text>
<text x="160" y="206" class="s">de texto</text>
<text x="322" y="190" class="s">1 tabla, 2.400</text>
<text x="322" y="206" class="s">pedidos, con tipos</text>
<text x="484" y="190" class="s">la misma tabla,</text>
<text x="484" y="206" class="s">ya aprobada</text>
<text x="646" y="190" class="s">24 filas de</text>
<text x="646" y="206" class="s">indicadores</text>
<text x="808" y="190" class="s">las 24 filas,</text>
<text x="808" y="206" class="s">sin cambios</text>

<!-- Detención -->
<path d="M 532 134 L 532 238" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#fl)"/>
<rect x="380" y="242" width="420" height="70" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.6"/>
<text x="396" y="264" class="h" style="font-size:14px">Si una regla falla, el flujo se detiene aquí</text>
<text x="396" y="284" class="m">el paso 'validar' falló: 820 fechas sin</text>
<text x="396" y="300" class="m">leer en entregas_2026_04.csv</text>
<text x="20" y="262" class="s">Los pasos 4 y 5 no se ejecutan:</text>
<text x="20" y="278" class="s">ningún indicador se calcula</text>
<text x="20" y="294" class="s">con datos que no pasaron.</text>

<!-- Bitácora -->
<rect x="20" y="330" width="600" height="128" rx="8" fill="#f2f2f2" stroke="#8a8a8a"/>
<text x="34" y="352" class="h" style="font-size:14px">La bitácora: una línea por paso</text>
<text x="34" y="374" class="m" xml:space="preserve">15:46:53  leer         2400 filas   0.05 s</text>
<text x="34" y="392" class="m" xml:space="preserve">15:46:53  armonizar    2400 filas   0.12 s</text>
<text x="34" y="410" class="m" xml:space="preserve">15:46:53  validar      2400 filas   0.01 s</text>
<text x="34" y="428" class="m" xml:space="preserve">15:46:53  resumir        24 filas   0.05 s</text>
<text x="34" y="446" class="m" xml:space="preserve">15:46:53  guardar        24 filas   0.01 s</text>

<rect x="640" y="330" width="300" height="128" rx="8" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="656" y="354" class="h" style="fill:#555555">Evitar</text>
<text x="656" y="378" class="s">un script de 300 líneas sin pasos</text>
<text x="656" y="396" class="s">con nombre: un error en la línea 240</text>
<text x="656" y="414" class="s">no dice en qué etapa ocurrió, y</text>
<text x="656" y="432" class="s">ninguna parte se puede probar sola.</text>

<rect x="20" y="476" width="920" height="66" rx="8" fill="#1a1a1a"/>
<text x="480" y="502" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Cada paso es una función; el flujo es la lista de funciones y el orden en que se aplican.</text>
<text x="480" y="526" class="m" text-anchor="middle" style="fill:#ffffff">pasos &lt;- list(leer = leer_crudo, armonizar = armonizar, validar = validar, resumir = resumir, guardar = guardar)</text>
</svg>
