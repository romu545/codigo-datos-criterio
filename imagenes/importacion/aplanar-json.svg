<text x="858" y="225" class="s" text-anchor="start" style="fill:#1a1a1a"><tspan x="858" dy="0">Barranquilla</tspan></text>
<rect x="540" y="234" width="410" height="28" rx="0" fill="#fff" stroke="#c4c4c4" stroke-width="1"/>
