<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 344" width="960" height="344" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Aplanar una respuesta JSON anidada</title>
<desc id="desc">La respuesta de la API tiene status, paginacion y un arreglo resultados. Cada resultado tiene id_operacion, fecha, monto_usd y un objeto cliente con nit y ciudad. Al aplanarla se obtiene una tabla con una fila por resultado y las columnas nit y ciudad al mismo nivel que las demás.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .t{font-size:22px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
  .w{fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<rect x="30" y="82" width="330" height="296" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="46" y="102.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="46" dy="0">{</tspan></text>
<text x="64" y="119.5" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="64" dy="0">&quot;status&quot;: &quot;ok&quot;,</tspan></text>
<text x="64" y="137.0" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="64" dy="0">&quot;paginacion&quot;: {…},</tspan></text>
<text x="64" y="154.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="64" dy="0">&quot;resultados&quot;: [</tspan></text>
<text x="82" y="172.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="82" dy="0">{</tspan></text>
<text x="100" y="189.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="100" dy="0">&quot;id_operacion&quot;: 1,</tspan></text>
<text x="100" y="207.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="100" dy="0">&quot;fecha&quot;: &quot;2026-01-20&quot;,</tspan></text>
<text x="100" y="224.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="100" dy="0">&quot;monto_usd&quot;: 1721.34,</tspan></text>
<text x="100" y="242.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="100" dy="0">&quot;cliente&quot;: {</tspan></text>
<text x="118" y="259.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="118" dy="0">&quot;nit&quot;: &quot;0516815654&quot;,</tspan></text>
<text x="118" y="277.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="118" dy="0">&quot;ciudad&quot;: &quot;Bogotá&quot;</tspan></text>
<text x="100" y="294.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="100" dy="0">}</tspan></text>
<text x="82" y="312.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="82" dy="0">},</tspan></text>
<text x="82" y="329.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="82" dy="0">{ … }</tspan></text>
<text x="64" y="347.0" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="64" dy="0">]</tspan></text>
<text x="46" y="364.5" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="46" dy="0">}</tspan></text>
<text x="380" y="130" class="s" text-anchor="start" style="fill:#555555"><tspan x="380" dy="0">status y paginacion:</tspan><tspan x="380" dy="18.2">metadatos, no filas</tspan></text>
<text x="380" y="196" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="380" dy="0">1. cada resultado</tspan><tspan x="380" dy="18.2">es una fila</tspan></text>
<text x="380" y="262" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="380" dy="0">2. cliente se vuelve</tspan><tspan x="380" dy="18.2">dos columnas</tspan></text>
<line x1="506" y1="232" x2="534" y2="232" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>
