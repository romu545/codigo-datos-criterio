<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 636" width="960" height="636" role="img" aria-labelledby="titulo desc">
<title id="titulo">Columnas vacías: detectarlas en una muestra y no leerlas</title>
<desc id="desc">Barras horizontales con el porcentaje de celdas con datos en cada una de las dieciséis columnas del archivo de cartera, después de declarar las marcas de faltante. Doce columnas tienen datos: la mayoría al cien por ciento, Fecha Pago al 57, Calificación Riesgo al 88 y Ciudad al 92. Cuatro columnas, Observaciones, Columna1, Columna2 y una columna sin nombre que aparece como ...16, están al cero por ciento, con trazo discontinuo, y se agrupan bajo la nota: no se leen. A la derecha, los tres pasos: leer una muestra como texto, contar celdas con datos por columna y excluir las vacías en la lectura definitiva.</desc>
