<rect x="20" y="402" width="704" height="120" rx="8" fill="none" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="250" y="548" class="b" style="font-weight:700;fill:#555555">No se leen: cuatro columnas sin un solo dato</text>
<rect x="740" y="64" width="190" height="380" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="756" y="94" class="h">Tres pasos</text>
<text x="756" y="130" class="b" style="font-weight:700">1. Muestra</text>
<text x="756" y="150" class="s">leer unas miles de</text>
<text x="756" y="168" class="s">filas, todo como texto</text>
<text x="756" y="206" class="b" style="font-weight:700">2. Contar</text>
<text x="756" y="226" class="s">celdas con datos</text>
<text x="756" y="244" class="s">en cada columna</text>
<text x="756" y="282" class="b" style="font-weight:700">3. Excluir</text>
<text x="756" y="302" class="s">las vacías en la</text>
<text x="756" y="320" class="s">lectura definitiva</text>
<rect x="752" y="344" width="166" height="86" rx="6" fill="#e6e6e6"/>
<text x="762" y="366" class="s" style="font-weight:700">Con DuckDB se puede</text>
<text x="762" y="384" class="s" style="font-weight:700">revisar el archivo</text>
<text x="762" y="402" class="s" style="font-weight:700">completo con</text>
<text x="762" y="420" class="m" style="font-weight:700">SUMMARIZE</text>
<rect x="30" y="572" width="900" height="44" rx="8" fill="#1a1a1a"/>
<text x="480" y="599" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Lo que no tiene datos no merece memoria, ni un nombre en la tabla de trabajo.</text>
</svg>
