<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 380" width="960" height="380" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Delegar el filtro y la unión al motor de base de datos</title>
<desc id="desc">Comparación de dos estrategias. Descargar las tablas facturas y clientes completas a la memoria y filtrar en R o Python mueve 2.200 filas para obtener un resumen. Enviar una consulta SQL con JOIN, WHERE y GROUP BY hace el trabajo dentro de DuckDB y solo llega a la memoria el resumen por ciudad.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .t{font-size:22px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
  .w{fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="436" fill="#ffffff"/>
<text x="30" y="102" class="h" text-anchor="start" style="fill:#7a7a7a"><tspan x="30" dy="0">Evitar: descargar todo y filtrar después</tspan></text>
<ellipse cx="100" cy="132" rx="60" ry="14" fill="#ededed" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M 40 132 L 40 222 A 60 14 0 0 0 160 222 L 160 132" fill="#ededed" stroke="#1a1a1a" stroke-width="1.8"/>
<ellipse cx="100" cy="132" rx="60" ry="14" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="100" y="176" class="m" text-anchor="middle" style="fill:#1a1a1a"><tspan x="100" dy="0">facturas</tspan></text>
<text x="100" y="198" class="m" text-anchor="middle" style="fill:#1a1a1a"><tspan x="100" dy="0">clientes</tspan></text>
<line x1="168" y1="180" x2="300" y2="180" stroke="#7a7a7a" stroke-width="3" marker-end="url(#flr)" stroke-dasharray="7 5"/>
<text x="234" y="168" class="s" text-anchor="middle" style="fill:#7a7a7a;font-weight:700"><tspan x="234" dy="0">2.200 filas</tspan></text>
<rect x="306" y="132" width="250" height="96" rx="10" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="320" y="156" class="h" text-anchor="start" style="fill:#7a7a7a"><tspan x="320" dy="0">R o Python</tspan></text>
<text x="320" y="178" class="s" text-anchor="start"><tspan x="320" dy="0">une, filtra y agrupa</tspan><tspan x="320" dy="18.2">en la memoria del equipo</tspan></text>
<line x1="560" y1="180" x2="610" y2="180" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<rect x="614" y="156" width="150" height="48" rx="10" fill="#fff" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="689" y="185" class="b" text-anchor="middle"><tspan x="689" dy="0">resumen</tspan></text>
<text x="780" y="170" class="s" text-anchor="start" style="fill:#7a7a7a;font-weight:700"><tspan x="780" dy="0">Funciona con 2.200 filas;</tspan><tspan x="780" dy="18.2">con 200 millones, no.</tspan></text>
<text x="30" y="272" class="h" text-anchor="start" style="fill:#1a1a1a"><tspan x="30" dy="0">Recomendado: enviar la pregunta al motor</tspan></text>
<rect x="40" y="286" width="230" height="112" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="52" y="308" class="m" text-anchor="start"><tspan x="52" dy="0">SELECT ciudad, sum(…)</tspan><tspan x="52" dy="18">FROM facturas</tspan><tspan x="52" dy="18">JOIN clientes …</tspan><tspan x="52" dy="18">WHERE fecha BETWEEN ? AND ?</tspan><tspan x="52" dy="18">GROUP BY ciudad</tspan></text>
<line x1="272" y1="342" x2="310" y2="342" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<g>
<ellipse cx="376" cy="298" rx="60" ry="14" fill="#ededed" stroke="#1a1a1a" stroke-width="1.8"/>
<path d="M 316 298 L 316 388 A 60 14 0 0 0 436 388 L 436 298" fill="#ededed" stroke="#1a1a1a" stroke-width="1.8"/>
<ellipse cx="376" cy="298" rx="60" ry="14" fill="#f7f7f7" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="376" y="342" class="m" text-anchor="middle" style="fill:#1a1a1a"><tspan x="376" dy="0">facturas</tspan></text>
<text x="376" y="364" class="m" text-anchor="middle" style="fill:#1a1a1a"><tspan x="376" dy="0">clientes</tspan></text>
</g>
<text x="376" y="416" class="s" text-anchor="middle" style="fill:#1a1a1a;font-weight:700"><tspan x="376" dy="0">el trabajo ocurre aquí</tspan></text>
<line x1="442" y1="342" x2="610" y2="342" stroke="#1a1a1a" stroke-width="1.6" marker-end="url(#flv)"/>
<text x="526" y="330" class="s" text-anchor="middle" style="fill:#1a1a1a;font-weight:700"><tspan x="526" dy="0">unas pocas filas</tspan></text>
<rect x="614" y="318" width="150" height="48" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="689" y="347" class="b" text-anchor="middle" style="fill:#1a1a1a;font-weight:700"><tspan x="689" dy="0">resumen</tspan></text>
<text x="780" y="332" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="780" dy="0">Solo el resultado</tspan><tspan x="780" dy="18.2">llega a la memoria.</tspan></text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>