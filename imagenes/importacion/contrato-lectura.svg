<title id="titulo">El contrato de lectura: tres decisiones antes de leer</title>
<desc id="desc">El archivo ventas_2026_01.csv se lee con tres decisiones explícitas: cómo está escrito (punto y coma, coma decimal, Latin-1), qué tipo tiene cada columna (los códigos como texto para conservar el cero inicial) y qué columnas se necesitan (cinco de siete).</desc>
