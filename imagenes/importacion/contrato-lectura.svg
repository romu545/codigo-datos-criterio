<line x1="664" y1="346" x2="825.5" y2="346" stroke="#9e9e9e" stroke-width="1.3"/>
<text x="664" y="370" class="m" text-anchor="start" style="fill:#9e9e9e"><tspan x="664" dy="0">usuario_auditoria</tspan></text>
<line x1="664" y1="366" x2="808.5" y2="366" stroke="#9e9e9e" stroke-width="1.3"/>
<text x="664" y="394" class="s" text-anchor="start" style="font-weight:700"><tspan x="664" dy="0">Lo que no se lee no ocupa memoria.</tspan></text>
