<text x="46" y="128" class="m" text-anchor="start"><tspan x="46" dy="0">2026-01-07;08001;0858053946;Barranquilla;969260,57;;aud_03</tspan></text>
<text x="46" y="148" class="m" text-anchor="start"><tspan x="46" dy="0">…</tspan></text>
