<text x="364" y="337" class="m" text-anchor="start" style="fill:#7a7a7a"><tspan x="364" dy="0">como número: 5001</tspan></text>
<text x="364" y="354" class="s" text-anchor="start"><tspan x="364" dy="0">ya no coincide con ningún código</tspan></text>
<text x="358" y="388" class="s" text-anchor="start" style="font-weight:700"><tspan x="358" dy="0">Los identificadores son etiquetas.</tspan></text>
