<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 424" width="960" height="424" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Deriva de esquema al apilar los recaudos mensuales</title>
<desc id="desc">Cuatro archivos de recaudos: los de 2025 nombran el monto vlr_total y el de 2026 lo llama valor_total. El archivo borrador_notas.csv queda fuera por el patrón. Apilar sin cuidado produce dos columnas de monto con vacíos; homologar el nombre y agregar archivo_origen produce una sola columna completa y trazable.</desc>
