<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 344" width="960" height="344" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Almacenamiento por filas (CSV) frente a por columnas (Parquet)</title>
<desc id="desc">Un CSV guarda los datos fila por fila, de modo que para leer dos columnas hay que recorrer todo el archivo. Parquet guarda cada columna en un bloque comprimido, así que leer dos columnas solo toca esos dos bloques.</desc>
