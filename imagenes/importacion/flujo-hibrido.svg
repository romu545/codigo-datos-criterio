<text x="95" y="114" class="b" text-anchor="middle"><tspan x="95" dy="0">CSV</tspan></text>
<rect x="30" y="136" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="95" y="158" class="b" text-anchor="middle"><tspan x="95" dy="0">Parquet</tspan></text>
<rect x="30" y="180" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="95" y="202" class="b" text-anchor="middle"><tspan x="95" dy="0">JSON</tspan></text>
<rect x="30" y="224" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="95" y="246" class="b" text-anchor="middle"><tspan x="95" dy="0">Excel</tspan></text>
<rect x="30" y="268" width="130" height="34" rx="6" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="95" y="290" class="b" text-anchor="middle"><tspan x="95" dy="0">.duckdb</tspan></text>
<text x="95" y="324" class="s" text-anchor="middle" style="font-weight:700"><tspan x="95" dy="0">Millones de filas, en disco</tspan></text>
<path d="M 190 92 L 440 150 L 440 262 L 190 310 Z" fill="#ededed" stroke="#1a1a1a" stroke-width="2"/>
<text x="300" y="186" class="t" text-anchor="middle" style="fill:#1a1a1a"><tspan x="300" dy="0">DuckDB</tspan></text>
<text x="300" y="210" class="m" text-anchor="middle" style="fill:#1a1a1a"><tspan x="300" dy="0">WHERE, GROUP BY, JOIN</tspan></text>
<text x="300" y="232" class="s" text-anchor="middle"><tspan x="300" dy="0">lee solo lo que la</tspan></text>
<text x="300" y="248" class="s" text-anchor="middle"><tspan x="300" dy="0">consulta necesita</tspan></text>
<line x1="162" y1="200" x2="186" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<line x1="444" y1="206" x2="500" y2="206" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="504" y="160" width="150" height="92" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="514" y1="182" x2="644" y2="182" stroke="#c4c4c4" stroke-width="1"/>
<line x1="514" y1="198" x2="644" y2="198" stroke="#c4c4c4" stroke-width="1"/>
<line x1="514" y1="214" x2="644" y2="214" stroke="#c4c4c4" stroke-width="1"/>
