<text x="579" y="175" class="s" text-anchor="middle" style="fill:#fff;font-weight:700"><tspan x="579" dy="0">data frame ligero</tspan></text>
<text x="579" y="274" class="s" text-anchor="middle" style="font-weight:700"><tspan x="579" dy="0">Miles de filas, en RAM</tspan></text>
<line x1="658" y1="206" x2="700" y2="206" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="704" y="120" width="226" height="172" rx="10" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="817" y="150" class="h" text-anchor="middle" style="fill:#1a1a1a"><tspan x="817" dy="0">R o Python</tspan></text>
<text x="730" y="183" class="b" text-anchor="start"><tspan x="730" dy="0">transformar y limpiar</tspan></text>
<text x="730" y="209" class="b" text-anchor="start"><tspan x="730" dy="0">modelar</tspan></text>
<text x="730" y="235" class="b" text-anchor="start"><tspan x="730" dy="0">graficar</tspan></text>
<text x="730" y="261" class="b" text-anchor="start"><tspan x="730" dy="0">reportar</tspan></text>
<text x="30" y="350" class="s" text-anchor="start"><tspan x="30" dy="0">DuckDB no reemplaza a tidyverse, pandas o polars: los complementa.</tspan></text>
