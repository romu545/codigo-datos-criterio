<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1070 400" width="1070" height="400" role="img" aria-labelledby="titulo desc">
<title id="titulo">Mapa de la importación de datos en tres capítulos</title>
<desc id="desc">El capítulo 3 cubre el criterio, las herramientas, la heurística de importación y los múltiples archivos. El capítulo 4 cubre Excel y Parquet, JSON y APIs, bases de datos y la elección de formato con un proyecto integrador. El capítulo 5 cubre la limpieza temprana: nombres de columnas, valores faltantes y booleanos, fechas, y columnas vacías con el contrato completo. Una flecha final apunta al capítulo 6, Tipos de datos y calidad.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
</defs>
<rect x="0" y="0" width="1070" height="400" fill="#ffffff"/>

<rect x="30" y="30" width="300" height="300" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
<rect x="30" y="30" width="300" height="56" rx="10" fill="#1a1a1a"/>
<rect x="30" y="68" width="300" height="18" fill="#1a1a1a"/>
<text x="46" y="54" class="s" style="fill:#fff;font-weight:700">CAPÍTULO 3, PARTE I</text>
<text x="46" y="76" class="h" style="fill:#fff">El contrato de lectura</text>
<text x="46" y="122" class="b" style="font-weight:700">1.</text>
<text x="68" y="122" class="b" style="font-weight:700">Importar no es un trámite</text>
<text x="68" y="140" class="s">memoria, velocidad, reproducibilidad</text>
<text x="46" y="172" class="b" style="font-weight:700">2.</text>
<text x="68" y="172" class="b" style="font-weight:700">El ecosistema de herramientas</text>
<text x="68" y="190" class="s">readr, pandas, polars y DuckDB</text>
<text x="46" y="222" class="b" style="font-weight:700">3.</text>
<text x="68" y="222" class="b" style="font-weight:700">La heurística de importación</text>
<text x="68" y="240" class="s">codificación, tipos y proyección</text>
<text x="46" y="272" class="b" style="font-weight:700">4.</text>
<text x="68" y="272" class="b" style="font-weight:700">Múltiples archivos</text>
<text x="68" y="290" class="s">patrones y deriva de esquema</text>
<line x1="332" y1="180" x2="348" y2="180" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>
<rect x="352" y="30" width="300" height="300" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
<rect x="352" y="30" width="300" height="56" rx="10" fill="#1a1a1a"/>
<rect x="352" y="68" width="300" height="18" fill="#1a1a1a"/>
<text x="368" y="54" class="s" style="fill:#fff;font-weight:700">CAPÍTULO 4, PARTE II</text>
<text x="368" y="76" class="h" style="fill:#fff">Formatos y fuentes</text>
<text x="368" y="122" class="b" style="font-weight:700">1.</text>
<text x="390" y="122" class="b" style="font-weight:700">Excel y Parquet</text>
<text x="390" y="140" class="s">hojas, rangos y formato columnar</text>
<text x="368" y="172" class="b" style="font-weight:700">2.</text>
<text x="390" y="172" class="b" style="font-weight:700">JSON y APIs</text>
<text x="390" y="190" class="s">aplanar estructuras anidadas</text>
<text x="368" y="222" class="b" style="font-weight:700">3.</text>
<text x="390" y="222" class="b" style="font-weight:700">Bases de datos</text>
<text x="390" y="240" class="s">delegar el trabajo al motor</text>
<text x="368" y="272" class="b" style="font-weight:700">4.</text>
<text x="390" y="272" class="b" style="font-weight:700">Elegir formato e integrador</text>
<text x="390" y="290" class="s">cuatro fuentes, un Parquet</text>
<line x1="654" y1="180" x2="670" y2="180" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>
<rect x="674" y="30" width="300" height="300" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
<rect x="674" y="30" width="300" height="56" rx="10" fill="#1a1a1a"/>
<rect x="674" y="68" width="300" height="18" fill="#1a1a1a"/>
<text x="690" y="54" class="s" style="fill:#fff;font-weight:700">CAPÍTULO 5, PARTE III</text>
<text x="690" y="76" class="h" style="fill:#fff">Limpieza temprana</text>
<text x="690" y="122" class="b" style="font-weight:700">1.</text>
<text x="712" y="122" class="b" style="font-weight:700">Nombres de columnas</text>
<text x="712" y="140" class="s">un vocabulario limpio desde el inicio</text>
<text x="690" y="172" class="b" style="font-weight:700">2.</text>
<text x="712" y="172" class="b" style="font-weight:700">Faltantes y booleanos</text>
<text x="712" y="190" class="s">qué significa un vacío; sí y no</text>
<text x="690" y="222" class="b" style="font-weight:700">3.</text>
<text x="712" y="222" class="b" style="font-weight:700">Fechas</text>
<text x="712" y="240" class="s">cada lenguaje a su manera</text>
<text x="690" y="272" class="b" style="font-weight:700">4.</text>
<text x="712" y="272" class="b" style="font-weight:700">Columnas vacías y contrato</text>
<text x="712" y="290" class="s">leer solo lo que tiene datos</text>
<line x1="976" y1="180" x2="994" y2="180" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>
<rect x="998" y="136" width="52" height="88" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="1024" y="172" class="h" text-anchor="middle"><tspan x="1024" dy="0">Cap.</tspan><tspan x="1024" dy="20">6</tspan></text>
<text x="30" y="362" class="s">Cap. 6: Tipos de datos y calidad, donde se audita la tabla que sale de la importación.</text>
</svg>
