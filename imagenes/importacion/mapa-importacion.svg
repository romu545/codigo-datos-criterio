<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 344" width="960" height="344" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Mapa de la importación de datos en dos capítulos</title>
<desc id="desc">El capítulo 3 cubre el criterio, las herramientas, el contrato de lectura y los múltiples archivos. El capítulo 4 cubre Excel, Parquet, JSON y APIs, bases de datos y la elección de formato, y cierra con un proyecto integrador que produce un archivo Parquet consolidado para el capítulo 5.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .t{font-size:22px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
  .w{fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="400" fill="#ffffff"/>
<rect x="30" y="86" width="395" height="270" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
<rect x="30" y="86" width="395" height="52" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="30" y="120" width="395" height="18" fill="#1a1a1a"/>
<text x="46" y="108" class="s" text-anchor="start" style="fill:#fff;font-weight:700"><tspan x="46" dy="0">CAPÍTULO 3, PARTE I</tspan></text>
<text x="46" y="128" class="h" text-anchor="start" style="fill:#fff"><tspan x="46" dy="0">El contrato de lectura</tspan></text>
<text x="52" y="171" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="52" dy="0">1.</tspan></text>
<text x="78" y="170" class="b" text-anchor="start" style="font-weight:700"><tspan x="78" dy="0">Importar no es un trámite</tspan></text>
<text x="78" y="187" class="s" text-anchor="start"><tspan x="78" dy="0">memoria, velocidad y reproducibilidad</tspan></text>
<text x="52" y="217" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="52" dy="0">2.</tspan></text>
<text x="78" y="216" class="b" text-anchor="start" style="font-weight:700"><tspan x="78" dy="0">El ecosistema de herramientas</tspan></text>
<text x="78" y="233" class="s" text-anchor="start"><tspan x="78" dy="0">readr, pandas, polars y DuckDB</tspan></text>
<text x="52" y="263" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="52" dy="0">3.</tspan></text>
<text x="78" y="262" class="b" text-anchor="start" style="font-weight:700"><tspan x="78" dy="0">La heurística de importación</tspan></text>
<text x="78" y="279" class="s" text-anchor="start"><tspan x="78" dy="0">codificación, tipos y proyección</tspan></text>
<text x="52" y="309" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="52" dy="0">4.</tspan></text>
<text x="78" y="308" class="b" text-anchor="start" style="font-weight:700"><tspan x="78" dy="0">Múltiples archivos</tspan></text>
<text x="78" y="325" class="s" text-anchor="start"><tspan x="78" dy="0">patrones y deriva de esquema</tspan></text>
<text x="409" y="346" class="s" text-anchor="end" style="fill:#1a1a1a;font-weight:700"><tspan x="409" dy="0">una sesión de unas 2 horas</tspan></text>
<line x1="430" y1="220" x2="462" y2="220" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>
<rect x="467" y="86" width="395" height="270" rx="10" fill="#fff" stroke="#1a1a1a" stroke-width="2"/>
<rect x="467" y="86" width="395" height="52" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="467" y="120" width="395" height="18" fill="#1a1a1a"/>
<text x="483" y="108" class="s" text-anchor="start" style="fill:#fff;font-weight:700"><tspan x="483" dy="0">CAPÍTULO 4, PARTE II</tspan></text>
<text x="483" y="128" class="h" text-anchor="start" style="fill:#fff"><tspan x="483" dy="0">Formatos y fuentes</tspan></text>
<text x="489" y="171" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="489" dy="0">1.</tspan></text>
<text x="515" y="170" class="b" text-anchor="start" style="font-weight:700"><tspan x="515" dy="0">Excel y Parquet</tspan></text>
<text x="515" y="187" class="s" text-anchor="start"><tspan x="515" dy="0">hojas, rangos y almacenamiento columnar</tspan></text>
<text x="489" y="217" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="489" dy="0">2.</tspan></text>
<text x="515" y="216" class="b" text-anchor="start" style="font-weight:700"><tspan x="515" dy="0">JSON y APIs</tspan></text>
<text x="515" y="233" class="s" text-anchor="start"><tspan x="515" dy="0">aplanar estructuras anidadas</tspan></text>
<text x="489" y="263" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="489" dy="0">3.</tspan></text>
<text x="515" y="262" class="b" text-anchor="start" style="font-weight:700"><tspan x="515" dy="0">Bases de datos</tspan></text>
<text x="515" y="279" class="s" text-anchor="start"><tspan x="515" dy="0">delegar el trabajo al motor</tspan></text>
<text x="489" y="309" class="b" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="489" dy="0">4.</tspan></text>
<text x="515" y="308" class="b" text-anchor="start" style="font-weight:700"><tspan x="515" dy="0">Elegir formato y proyecto integrador</tspan></text>
<text x="515" y="325" class="s" text-anchor="start"><tspan x="515" dy="0">cuatro fuentes, un Parquet</tspan></text>
<text x="846" y="346" class="s" text-anchor="end" style="fill:#1a1a1a;font-weight:700"><tspan x="846" dy="0">una sesión de unas 2 horas</tspan></text>
<line x1="864" y1="220" x2="884" y2="220" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#fl)"/>
<rect x="888" y="176" width="52" height="88" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="914" y="210" class="h" text-anchor="middle" style="fill:#1a1a1a"><tspan x="914" dy="0">Cap.</tspan><tspan x="914" dy="20">5</tspan></text>
<text x="30" y="386" class="s" text-anchor="start"><tspan x="30" dy="0">Cap. 5: Tipos de datos y calidad, donde se audita el Parquet consolidado.</tspan></text>
