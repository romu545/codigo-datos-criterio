<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 294" width="960" height="294" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">El cuello de botella es la memoria, no el disco</title>
<desc id="desc">Un mismo archivo CSV en disco se puede leer de dos maneras. La lectura ingenua carga todas las columnas con tipos inferidos y ocupa casi toda la memoria disponible. La lectura con contrato carga solo las columnas necesarias con tipos declarados y deja memoria libre.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .t{font-size:22px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
  .w{fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="350" fill="#ffffff"/>
<rect x="40" y="120" width="170" height="190" rx="10" fill="#f2f2f2" stroke="#555555" stroke-width="1.5"/>
<text x="125" y="146" class="s" text-anchor="middle" style="fill:#555555;font-weight:700"><tspan x="125" dy="0">En disco</tspan></text>
<text x="125" y="168" class="m" text-anchor="middle"><tspan x="125" dy="0">ventas.csv</tspan></text>
<rect x="58" y="186" width="14" height="100" rx="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
<rect x="78" y="186" width="14" height="100" rx="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
<rect x="98" y="186" width="14" height="100" rx="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
<rect x="118" y="186" width="14" height="100" rx="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
<rect x="138" y="186" width="14" height="100" rx="3" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
<rect x="158" y="186" width="14" height="100" rx="3" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
<rect x="178" y="186" width="14" height="100" rx="3" fill="#8a8a8a" stroke="#8a8a8a" stroke-width="1"/>
<text x="125" y="302" class="s" text-anchor="middle"><tspan x="125" dy="0">7 columnas</tspan></text>
<text x="360" y="98" class="h" text-anchor="start" style="fill:#7a7a7a"><tspan x="360" dy="0">Lectura ingenua</tspan></text>
<text x="360" y="116" class="s" text-anchor="start"><tspan x="360" dy="0">todas las columnas, tipos adivinados</tspan></text>
<rect x="360" y="132" width="440" height="46" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="363" y="135" width="403.62" height="40" rx="4" fill="#ffffff" stroke="#7a7a7a" stroke-width="1" stroke-dasharray="7 5"/>
<text x="374" y="160" class="s" text-anchor="start" style="fill:#7a7a7a;font-weight:700"><tspan x="374" dy="0">7 columnas, incluidas las que no se usan</tspan></text>
<text x="812" y="152" class="s" text-anchor="start"><tspan x="812" dy="0">Memoria</tspan><tspan x="812" dy="15">del equipo</tspan></text>
<text x="360" y="198" class="s" text-anchor="start" style="fill:#7a7a7a;font-weight:700"><tspan x="360" dy="0">Poco margen: el próximo mes el archivo puede no caber</tspan></text>
<text x="360" y="228" class="h" text-anchor="start" style="fill:#1a1a1a"><tspan x="360" dy="0">Lectura con contrato</tspan></text>
<text x="360" y="246" class="s" text-anchor="start"><tspan x="360" dy="0">solo lo necesario, tipos declarados</tspan></text>
<rect x="360" y="262" width="440" height="46" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="363" y="265" width="182.28" height="40" rx="4" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1"/>
<text x="374" y="290" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="374" dy="0">5 columnas tipadas</tspan></text>
<text x="812" y="282" class="s" text-anchor="start"><tspan x="812" dy="0">Memoria</tspan><tspan x="812" dy="15">del equipo</tspan></text>
<text x="360" y="328" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="360" dy="0">Margen para transformar, unir y modelar</tspan></text>
<path d="M 214 190 C 280 190, 290 155, 352 155" fill="none" stroke="#7a7a7a" stroke-width="1.8" marker-end="url(#flr)" stroke-dasharray="7 5"/>
<path d="M 214 240 C 280 240, 290 285, 352 285" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#flv)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>