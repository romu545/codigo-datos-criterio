<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" role="img" aria-labelledby="titulo desc">
<title id="titulo">De los nombres del archivo a nombres de trabajo</title>
<desc id="desc">A la izquierda, ocho nombres tal como vienen en el archivo, con espacios, tildes y símbolos: N° Factura, NIT Cliente, Fecha Emisión, Valor Factura ($), ¿Pagó?, Calificación Riesgo, Registrado En y una columna sin nombre. Al centro, las reglas: minúsculas, sin tildes, sin símbolos, palabras unidas con guion bajo y un nombre que diga qué contiene. A la derecha, los nombres de trabajo: factura, nit, fecha_emision, valor_factura, pagada, calificacion, registrado_en. La columna sin nombre aparece con trazo discontinuo y la nota: se descarta.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
</defs>

<rect x="0" y="0" width="960" height="470" fill="#ffffff"/>

<text x="30" y="40" class="s" style="font-weight:700">EN EL ARCHIVO</text>
<text x="700" y="40" class="s" style="font-weight:700">EN LA TABLA DE TRABAJO</text>

<!-- izquierda -->
<g class="m">
<rect x="30" y="54" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="76" class="m">N° Factura</text>
<rect x="30" y="98" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="120" class="m">NIT Cliente</text>
<rect x="30" y="142" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="164" class="m">Fecha Emisión</text>
<rect x="30" y="186" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="208" class="m">Valor Factura ($)</text>
<rect x="30" y="230" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="252" class="m">¿Pagó?</text>
<rect x="30" y="274" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="296" class="m">Calificación Riesgo</text>
<rect x="30" y="318" width="230" height="34" rx="6" fill="#f2f2f2"/><text x="44" y="340" class="m">Registrado En</text>
<rect x="30" y="362" width="230" height="34" rx="6" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="44" y="384" class="m" style="fill:#7a7a7a">(sin nombre)</text>
</g>

<!-- reglas -->
<rect x="318" y="54" width="324" height="342" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="338" y="86" class="h">Reglas para nombrar</text>
<text x="338" y="122" class="b" style="font-weight:700">1.</text><text x="362" y="122" class="b">minúsculas</text>
<text x="338" y="154" class="b" style="font-weight:700">2.</text><text x="362" y="154" class="b">sin tildes ni eñes</text>
<text x="338" y="186" class="b" style="font-weight:700">3.</text><text x="362" y="186" class="b">sin espacios ni símbolos: </text><text x="540" y="186" class="m">° ¿ ? ( $ )</text>
<text x="338" y="218" class="b" style="font-weight:700">4.</text><text x="362" y="218" class="b">palabras unidas con </text><text x="508" y="218" class="m">_</text>
<text x="338" y="250" class="b" style="font-weight:700">5.</text><text x="362" y="250" class="b">un nombre que diga qué contiene</text>
<rect x="334" y="272" width="292" height="108" rx="6" fill="#e6e6e6"/>
<text x="346" y="296" class="s" style="font-weight:700">Automático, con una función:</text>
<text x="346" y="316" class="m">¿Pagó?</text><line x1="408" y1="311" x2="444" y2="311" stroke="#555555" stroke-width="1.5" marker-end="url(#fl)"/><text x="454" y="316" class="m">pago</text>
<text x="346" y="344" class="s" style="font-weight:700">Explícito, en el contrato:</text>
<text x="346" y="364" class="m">¿Pagó?</text><line x1="408" y1="359" x2="444" y2="359" stroke="#555555" stroke-width="1.5" marker-end="url(#fl)"/><text x="454" y="364" class="m">pagada</text>

<line x1="264" y1="225" x2="312" y2="225" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<line x1="646" y1="225" x2="694" y2="225" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>

<!-- derecha -->
<rect x="700" y="54" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="76" class="m" style="fill:#ffffff">factura</text>
<rect x="700" y="98" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="120" class="m" style="fill:#ffffff">nit</text>
<rect x="700" y="142" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="164" class="m" style="fill:#ffffff">fecha_emision</text>
<rect x="700" y="186" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="208" class="m" style="fill:#ffffff">valor_factura</text>
<rect x="700" y="230" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="252" class="m" style="fill:#ffffff">pagada</text>
<rect x="700" y="274" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="296" class="m" style="fill:#ffffff">calificacion</text>
<rect x="700" y="318" width="230" height="34" rx="6" fill="#1a1a1a"/><text x="714" y="340" class="m" style="fill:#ffffff">registrado_en</text>
<rect x="700" y="362" width="230" height="34" rx="6" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="714" y="384" class="s" style="fill:#7a7a7a">se descarta</text>

<rect x="30" y="414" width="900" height="40" rx="8" fill="#1a1a1a"/>
<text x="480" y="439" class="b" text-anchor="middle" style="fill:#ffffff;font-weight:700">Un buen nombre se escribe sin comillas y se entiende sin abrir el diccionario de datos.</text>
</svg>
