<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 354" width="960" height="354" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Un conjunto Parquet particionado por mes</title>
<desc id="desc">La carpeta ventas_2025_particionado contiene una subcarpeta por mes, de mes=1 a mes=12, cada una con un archivo Parquet. Una consulta que filtra mes igual a 12 lee solo la carpeta mes=12; las otras once se saltan sin abrirlas.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .t{font-size:22px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
  .w{fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="410" fill="#ffffff"/>
<text x="40" y="92" class="m" text-anchor="start" style="font-weight:700"><tspan x="40" dy="0">ventas_2025_particionado/</tspan></text>
<line x1="50" y1="100" x2="50" y2="121" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="121" x2="70" y2="121" stroke="#c4c4c4" stroke-width="1.4"/>
<rect x="72" y="104" width="330" height="30" rx="5" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="84" y="124" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="84" dy="0">mes=1/</tspan></text>
<text x="180" y="124" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="180" dy="0">data_0.parquet</tspan></text>
<text x="392" y="124" class="s" text-anchor="end" style="fill:#8a8a8a"><tspan x="392" dy="0">se salta</tspan></text>
<line x1="50" y1="134" x2="50" y2="155" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="155" x2="70" y2="155" stroke="#c4c4c4" stroke-width="1.4"/>
<rect x="72" y="138" width="330" height="30" rx="5" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="84" y="158" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="84" dy="0">mes=2/</tspan></text>
<text x="180" y="158" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="180" dy="0">data_0.parquet</tspan></text>
<text x="392" y="158" class="s" text-anchor="end" style="fill:#8a8a8a"><tspan x="392" dy="0">se salta</tspan></text>
<line x1="50" y1="168" x2="50" y2="189" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="189" x2="70" y2="189" stroke="#c4c4c4" stroke-width="1.4"/>
<rect x="72" y="172" width="330" height="30" rx="5" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="84" y="192" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="84" dy="0">mes=3/</tspan></text>
<text x="180" y="192" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="180" dy="0">data_0.parquet</tspan></text>
<text x="392" y="192" class="s" text-anchor="end" style="fill:#8a8a8a"><tspan x="392" dy="0">se salta</tspan></text>
<line x1="50" y1="202" x2="50" y2="223" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="223" x2="70" y2="223" stroke="#c4c4c4" stroke-width="1.4"/>
<text x="78" y="228" class="m" text-anchor="start" style="fill:#555555"><tspan x="78" dy="0">…</tspan></text>
<line x1="50" y1="236" x2="50" y2="257" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="257" x2="70" y2="257" stroke="#c4c4c4" stroke-width="1.4"/>
<rect x="72" y="240" width="330" height="30" rx="5" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="84" y="260" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="84" dy="0">mes=10/</tspan></text>
<text x="180" y="260" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="180" dy="0">data_0.parquet</tspan></text>
<text x="392" y="260" class="s" text-anchor="end" style="fill:#8a8a8a"><tspan x="392" dy="0">se salta</tspan></text>
<line x1="50" y1="270" x2="50" y2="291" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="291" x2="70" y2="291" stroke="#c4c4c4" stroke-width="1.4"/>
<rect x="72" y="274" width="330" height="30" rx="5" fill="#ffffff" stroke="#7a7a7a" stroke-width="1.2" stroke-dasharray="7 5"/>
<text x="84" y="294" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="84" dy="0">mes=11/</tspan></text>
<text x="180" y="294" class="m" text-anchor="start" style="fill:#8a8a8a"><tspan x="180" dy="0">data_0.parquet</tspan></text>
<text x="392" y="294" class="s" text-anchor="end" style="fill:#8a8a8a"><tspan x="392" dy="0">se salta</tspan></text>
<line x1="50" y1="304" x2="50" y2="325" stroke="#c4c4c4" stroke-width="1.4"/>
<line x1="50" y1="325" x2="70" y2="325" stroke="#c4c4c4" stroke-width="1.4"/>
<rect x="72" y="308" width="330" height="30" rx="5" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="84" y="328" class="m" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="84" dy="0">mes=12/</tspan></text>
<text x="180" y="328" class="m" text-anchor="start" style="fill:#1a1a1a"><tspan x="180" dy="0">data_0.parquet</tspan></text>
<text x="392" y="328" class="s" text-anchor="end" style="fill:#1a1a1a;font-weight:700"><tspan x="392" dy="0">se lee</tspan></text>
<rect x="470" y="128" width="450" height="126" rx="8" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="486" y="156" class="m" text-anchor="start"><tspan x="486" dy="0">SELECT count(*)</tspan></text>
<text x="486" y="178" class="m" text-anchor="start"><tspan x="486" dy="0">FROM read_parquet(</tspan></text>
<text x="510" y="200" class="m" text-anchor="start"><tspan x="510" dy="0">&#x27;ventas_2025_particionado/*/*.parquet&#x27;,</tspan></text>
<text x="510" y="222" class="m" text-anchor="start"><tspan x="510" dy="0">hive_partitioning = true)</tspan></text>
<text x="486" y="244" class="m" text-anchor="start" style="font-weight:700"><tspan x="486" dy="0">WHERE mes = 12</tspan></text>
<path d="M 470 232 C 430 260, 430 300, 406 322" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)"/>
<text x="470" y="292" class="b" text-anchor="start"><tspan x="470" dy="0">El nombre de cada carpeta guarda el valor de la</tspan><tspan x="470" dy="21">columna mes. Al filtrar por esa columna, el motor</tspan><tspan x="470" dy="21">descarta las carpetas que no coinciden sin abrirlas.</tspan></text>
<text x="470" y="376" class="h" text-anchor="start"><tspan x="470" dy="0">Se lee 1 de 12 archivos.</tspan></text>
