<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 324" width="960" height="324" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">Proyecto integrador: cuatro fuentes, un Parquet</title>
<desc id="desc">Las ventas en CSV y las sucursales en Excel se unen por codigo_dane. Las operaciones en JSON y los clientes de la base de datos se unen por nit. El resultado consolidado se guarda en Parquet y se audita en el capítulo 6.</desc>
