<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 56 960 464" width="960" height="464" role="img" aria-labelledby="titulo desc" xmlns:c2pa="http://c2pa.org/manifest">
<title id="titulo">La IA acelera el código; el criterio sigue siendo tuyo</title>
<desc id="desc">Cinco etapas del análisis de datos: importar, validar y limpiar, explorar, automatizar y comunicar. Para cada una se muestra qué puede acelerar la inteligencia artificial y qué pregunta exige criterio propio.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .t{font-size:22px;font-weight:700}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:14px}
  .w{fill:#ffffff}
</style>
<defs>
  <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555555"/></marker>
  <marker id="flr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a7a7a"/></marker>
  <marker id="flv" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/></marker>
</defs>

<rect x="0" y="0" width="960" height="520" fill="#ffffff"/>
<rect x="30" y="80" width="168" height="104" rx="10" fill="#ffffff" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="42" y="102" class="s" text-anchor="start" style="fill:#555555;font-weight:700"><tspan x="42" dy="0">La IA puede</tspan></text>
<text x="42" y="124" class="b" text-anchor="start"><tspan x="42" dy="0">Escribir la lectura</tspan><tspan x="42" dy="19">de un CSV o</tspan><tspan x="42" dy="19">una API</tspan></text>
<rect x="30" y="220" width="168" height="44" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="114.0" y="248" class="h" text-anchor="middle" style="fill:#fff"><tspan x="114.0" dy="0">Importar</tspan></text>
<line x1="114.0" y1="186" x2="114.0" y2="216" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<rect x="30" y="296" width="168" height="104" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="42" y="318" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="42" dy="0">Tú decides</tspan></text>
<text x="42" y="340" class="b" text-anchor="start"><tspan x="42" dy="0">¿Se conservaron</tspan><tspan x="42" dy="19">los ceros del</tspan><tspan x="42" dy="19">código DANE?</tspan></text>
<line x1="114.0" y1="266" x2="114.0" y2="292" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)"/>
<line x1="199" y1="242" x2="212" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="213" y="80" width="168" height="104" rx="10" fill="#ffffff" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="225" y="102" class="s" text-anchor="start" style="fill:#555555;font-weight:700"><tspan x="225" dy="0">La IA puede</tspan></text>
<text x="225" y="124" class="b" text-anchor="start"><tspan x="225" dy="0">Proponer</tspan><tspan x="225" dy="19">conversiones de</tspan><tspan x="225" dy="19">tipos y filtros</tspan></text>
<rect x="213" y="220" width="168" height="44" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="297.0" y="248" class="h" text-anchor="middle" style="fill:#fff"><tspan x="297.0" dy="0">Validar y limpiar</tspan></text>
<line x1="297.0" y1="186" x2="297.0" y2="216" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<rect x="213" y="296" width="168" height="104" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="225" y="318" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="225" dy="0">Tú decides</tspan></text>
<text x="225" y="340" class="b" text-anchor="start"><tspan x="225" dy="0">¿Qué significa</tspan><tspan x="225" dy="19">un vacío en</tspan><tspan x="225" dy="19">este negocio?</tspan></text>
<line x1="297.0" y1="266" x2="297.0" y2="292" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)"/>
<line x1="382" y1="242" x2="395" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="396" y="80" width="168" height="104" rx="10" fill="#ffffff" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="408" y="102" class="s" text-anchor="start" style="fill:#555555;font-weight:700"><tspan x="408" dy="0">La IA puede</tspan></text>
<text x="408" y="124" class="b" text-anchor="start"><tspan x="408" dy="0">Generar un</tspan><tspan x="408" dy="19">gráfico en</tspan><tspan x="408" dy="19">segundos</tspan></text>
<rect x="396" y="220" width="168" height="44" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480.0" y="248" class="h" text-anchor="middle" style="fill:#fff"><tspan x="480.0" dy="0">Explorar y graficar</tspan></text>
<line x1="480.0" y1="186" x2="480.0" y2="216" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<rect x="396" y="296" width="168" height="104" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="408" y="318" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="408" dy="0">Tú decides</tspan></text>
<text x="408" y="340" class="b" text-anchor="start"><tspan x="408" dy="0">¿La escala o el</tspan><tspan x="408" dy="19">color sugieren</tspan><tspan x="408" dy="19">algo falso?</tspan></text>
<line x1="480.0" y1="266" x2="480.0" y2="292" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)"/>
<line x1="565" y1="242" x2="578" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="579" y="80" width="168" height="104" rx="10" fill="#ffffff" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="591" y="102" class="s" text-anchor="start" style="fill:#555555;font-weight:700"><tspan x="591" dy="0">La IA puede</tspan></text>
<text x="591" y="124" class="b" text-anchor="start"><tspan x="591" dy="0">Armar un script</tspan><tspan x="591" dy="19">que corra cada</tspan><tspan x="591" dy="19">mes</tspan></text>
<rect x="579" y="220" width="168" height="44" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="663.0" y="248" class="h" text-anchor="middle" style="fill:#fff"><tspan x="663.0" dy="0">Automatizar</tspan></text>
<line x1="663.0" y1="186" x2="663.0" y2="216" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<rect x="579" y="296" width="168" height="104" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="591" y="318" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="591" dy="0">Tú decides</tspan></text>
<text x="591" y="340" class="b" text-anchor="start"><tspan x="591" dy="0">¿Qué pasa si la</tspan><tspan x="591" dy="19">fuente cambia</tspan><tspan x="591" dy="19">una columna?</tspan></text>
<line x1="663.0" y1="266" x2="663.0" y2="292" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)"/>
<line x1="748" y1="242" x2="761" y2="242" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<rect x="762" y="80" width="168" height="104" rx="10" fill="#ffffff" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="774" y="102" class="s" text-anchor="start" style="fill:#555555;font-weight:700"><tspan x="774" dy="0">La IA puede</tspan></text>
<text x="774" y="124" class="b" text-anchor="start"><tspan x="774" dy="0">Redactar un</tspan><tspan x="774" dy="19">resumen de los</tspan><tspan x="774" dy="19">resultados</tspan></text>
<rect x="762" y="220" width="168" height="44" rx="10" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="846.0" y="248" class="h" text-anchor="middle" style="fill:#fff"><tspan x="846.0" dy="0">Comunicar</tspan></text>
<line x1="846.0" y1="186" x2="846.0" y2="216" stroke="#555555" stroke-width="1.8" marker-end="url(#fl)"/>
<rect x="762" y="296" width="168" height="104" rx="10" fill="#d6d6d6" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="774" y="318" class="s" text-anchor="start" style="fill:#1a1a1a;font-weight:700"><tspan x="774" dy="0">Tú decides</tspan></text>
<text x="774" y="340" class="b" text-anchor="start"><tspan x="774" dy="0">¿La conclusión</tspan><tspan x="774" dy="19">se sostiene con</tspan><tspan x="774" dy="19">los datos?</tspan></text>
<line x1="846.0" y1="266" x2="846.0" y2="292" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)"/>
<path d="M 846.0 402 L 846.0 436 L 114.0 436 L 114.0 408" fill="none" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#fl)" stroke-dasharray="6 5"/>
<rect x="230.0" y="418" width="500" height="36" rx="18" fill="#fff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="480.0" y="442" class="b" text-anchor="middle" style="font-weight:700"><tspan x="480.0" dy="0">Ejecutar, comprobar y poder explicarlo: el ciclo no se delega</tspan></text>
<text x="30" y="488" class="s" text-anchor="start"><tspan x="30" dy="0">El código que corre sin errores no demuestra que el análisis sea correcto.</tspan></text>
