<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" role="img" aria-labelledby="titulo desc">
<title id="titulo">Formato ancho y formato largo</title>
<desc id="desc">A la izquierda, una tabla ancha con una columna por mes: sucursal, ene, feb y mar, con las metas de S01 y S02. A la derecha, la misma información en formato largo: una fila por sucursal y mes, con las columnas sucursal, mes y meta. Una flecha de ancho a largo con pivot_longer, melt y UNPIVOT, y otra de largo a ancho con pivot_wider, pivot y PIVOT. El ancho es cómodo para leer y para reportes, pero los nombres de columna guardan datos; el largo es cómodo para filtrar, agrupar, unir y graficar. Abajo, la definición de datos ordenados: cada variable en una columna, cada observación en una fila y cada valor en una celda.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
  .b{font-size:15.5px}
  .s{font-size:14px;fill:#3d3d3d}
  .m{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12.5px}
  .c{font-family:"Source Code Pro",Consolas,"DejaVu Sans Mono",monospace;font-size:12px}
</style>
<defs>
