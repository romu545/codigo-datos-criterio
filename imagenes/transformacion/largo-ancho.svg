<line x1="352" y1="90" x2="586" y2="90" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="469" y="76" class="s" text-anchor="middle" style="font-weight:700">de ancho a largo</text>
<text x="469" y="112" class="m" text-anchor="middle">pivot_longer(), melt(), UNPIVOT</text>
<line x1="586" y1="160" x2="352" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#fl)"/>
<text x="469" y="146" class="s" text-anchor="middle" style="font-weight:700">de largo a ancho</text>
<text x="469" y="182" class="m" text-anchor="middle">pivot_wider(), pivot(), PIVOT</text>
<rect x="30" y="280" width="900" height="64" rx="10" fill="#f2f2f2" stroke="#c4c4c4" stroke-width="1.5"/>
<text x="48" y="306" class="b" style="font-weight:700">Datos ordenados (tidy): cada variable en una columna, cada observación en una fila</text>
<text x="48" y="330" class="b">y cada valor en una celda. Se analiza en largo; se presenta en ancho cuando la tabla es para leer.</text>
