<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 990 460" width="990" height="460" role="img" aria-labelledby="titulo desc">
<title id="titulo">Tipos de unión entre tablas</title>
<desc id="desc">Una tabla x de ventas con productos P1, P2, P1 y P9, y una tabla y de productos con P1, P2 y P3 y su categoría. La unión izquierda conserva las cuatro ventas y deja NA en P9. La interna conserva solo las tres ventas con pareja. La semi devuelve las filas de x con pareja sin agregar columnas. La anti devuelve la venta de P9, sin pareja, y sirve para auditar. Con trazo discontinuo, Evitar: una clave repetida en y hace que cada venta de P1 salga dos veces; hay que contar las filas antes y después o declarar la relación esperada. Al pie: una unión izquierda nunca debería cambiar el número de filas de x.</desc>
<style>
  text{font-family:"Source Sans 3","Source Sans Pro","Segoe UI",Helvetica,Arial,sans-serif;fill:#1a1a1a}
  .h{font-size:17px;font-weight:700}
